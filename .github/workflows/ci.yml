name: CI

on:
  pull_request:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-kepu-video-server/requirements-dev.lock
      - name: Install FFmpeg and PDF tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg poppler-utils
      - name: Install backend dependencies
        working-directory: ai-kepu-video-server
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
      - name: Check declared dependency compatibility
        run: |
          python scripts/check_dependency_lock.py
          python -m pip check
      - name: Static Python checks
        working-directory: ai-kepu-video-server
        run: ruff check src api_server.py
      - name: Compile backend
        working-directory: ai-kepu-video-server
        run: python -m compileall src api_server.py
      - name: Test backend
        working-directory: ai-kepu-video-server
        env:
          INSIGHTCUT_SKIP_DOTENV: "1"
          INSIGHTCUT_DATA_ROOT: ${{ runner.temp }}/backend-tests
          INSIGHTCUT_DB_PATH: ${{ runner.temp }}/backend-tests/local.db
        run: python -m pytest -q
      - name: Audit backend dependencies
        working-directory: ai-kepu-video-server
        run: pip-audit --disable-pip --no-deps -r requirements-dev.lock

  frontend:
    name: Frontend tests, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ai-kepu-video-web/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: ai-kepu-video-web/frontend
        run: npm ci
      - name: Static JavaScript checks
        working-directory: ai-kepu-video-web/frontend
        run: npm run lint
      - name: Build frontend
        working-directory: ai-kepu-video-web/frontend
        run: npm run build
      - name: Test frontend
        working-directory: ai-kepu-video-web/frontend
        run: npm run test:all
      - name: Audit frontend dependencies
        working-directory: ai-kepu-video-web/frontend
        run: |
          for attempt in 1 2 3; do
            if npm audit --package-lock-only --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1

  full-stack-e2e:
    name: Real full-stack Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-kepu-video-server/requirements-dev.lock
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Install backend dependencies
        working-directory: ai-kepu-video-server
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ai-kepu-video-web/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: ai-kepu-video-web/frontend
        run: npm ci
      - name: Install Chromium
        working-directory: ai-kepu-video-web/frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend browser E2E
        working-directory: ai-kepu-video-web/frontend
        run: npm run test:e2e
      - name: Run real full-stack E2E
        working-directory: ai-kepu-video-web/frontend
        run: npx playwright test --config=playwright.fullstack.config.js
      - name: Complete media and draft verification
        working-directory: ai-kepu-video-server
        env:
          INSIGHTCUT_FLOW_SUMMARY: ${{ github.workspace }}/ci-evidence/flow.json
        run: python scripts/verify_local_flow.py
      - name: Preserve failure diagnostics and media summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-stack-evidence
          retention-days: 7
          path: |
            ai-kepu-video-web/frontend/test-results-browser/
            ai-kepu-video-web/frontend/test-results-fullstack/
            ai-kepu-video-server/.e2e-runtime/logs/
            ci-evidence/

  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Contribution policy
        run: |
          python scripts/check_contribution.py
          python scripts/test_contribution.py
      - name: Check public repository assets
        run: python scripts/check_readme_assets.py
      - name: Check tracked local-only paths
        run: |
          if git ls-files | grep -E '(^|/)(\.env$|.*\.db$|.*\.sqlite$|.*\.sqlite3$|logs/|output/|data/local\.db|\.playwright-mcp/|artifacts/|design-qa-artifacts/|design-preview/|docs/design-exploration/|docs/superpowers/)' ; then
            echo "Local-only file is tracked. Remove it or document why it is public."
            exit 1
          fi
      - name: Check machine-specific paths
        run: |
          machine_path='/Users'"/mima1234"
          codex_runtime='\.cache/codex'"-runtimes"
          if git grep -n -I -E "${machine_path}|${codex_runtime}" -- . ; then
            echo "Machine-specific path is tracked. Use a repository-relative or generic example path."
            exit 1
          fi

  platform:
    name: Filesystem (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      INSIGHTCUT_SKIP_DOTENV: '1'
      INSIGHTCUT_DATA_ROOT: ${{ github.workspace }}/.ci-platform
      INSIGHTCUT_DB_PATH: ${{ github.workspace }}/.ci-platform/local.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        working-directory: ai-kepu-video-server
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install media tools on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install media tools on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Verify tools and filesystem behavior
        working-directory: ai-kepu-video-server
        run: >-
          python -m pytest -q tests/test_reliability_plan.py
          -k "draft_publisher or draft_replacement or recovery_rolls_back or cancel_during_draft or maintenance_lock or snapshot_migration or export_paths"
      - name: Check FFmpeg discovery
        run: |
          ffmpeg -version
          ffprobe -version

  security:
    name: Workflow and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install fixed analysis tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Check workflow syntax
        run: '"$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes='
      - name: Scan proposed changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: '"$(go env GOPATH)/bin/gitleaks" git --redact --log-opts="$BASE_SHA..$HEAD_SHA"'
      - name: Scan current published tree
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/scan-tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/scan-tree"
          "$(go env GOPATH)/bin/gitleaks" dir "$RUNNER_TEMP/scan-tree" --redact --config .gitleaks.toml
